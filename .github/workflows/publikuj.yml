name: Publikowanie postów maturalnych

on:
  schedule:
    # co 2 h od 8 do 20 czasu polskiego (cron w UTC – zima i lato; skrypt sam sprawdza godzinę PL)
    - cron: "5 6-19 * * *"
  workflow_dispatch:
    inputs:
      tylko_rolka:
        description: "Wrzuć teraz tylko rolkę (bez karuzeli)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publikuj

jobs:
  publikuj:
    runs-on: ubuntu-latest
    env:
      # grafiki trzymamy na osobnej gałęzi "obrazki", nadpisywanej za każdym razem (repo nie puchnie)
      BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/obrazki
      IG_TOKEN_MATMA: ${{ secrets.IG_TOKEN_MATMA }}
      IG_USER_ID_MATMA: ${{ secrets.IG_USER_ID_MATMA }}
      IG_TOKEN_POLSKI: ${{ secrets.IG_TOKEN_POLSKI }}
      IG_USER_ID_POLSKI: ${{ secrets.IG_USER_ID_POLSKI }}
      IG_TOKEN_ANGIELSKI: ${{ secrets.IG_TOKEN_ANGIELSKI }}
      IG_USER_ID_ANGIELSKI: ${{ secrets.IG_USER_ID_ANGIELSKI }}
      TRYB: ${{ github.event_name == 'schedule' && '--auto' || '' }}
      ROLKA_TERAZ: ${{ inputs.tylko_rolka && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalacja
        run: |
          npm ci
          pip install -q edge-tts
          sudo apt-get install -y -qq fonts-noto-color-emoji > /dev/null
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Grafiki postów do publikacji
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          if [ -n "$ROLKA_TERAZ" ]; then : > plan.txt; node publikuj_rolke.js --plan | tee rolki.txt
          else
            node publikuj.js $TRYB --plan | tee plan.txt
            if [ -n "$TRYB" ]; then node publikuj_rolke.js --auto --plan | tee rolki.txt; else : > rolki.txt; fi
          fi
          [ -s plan.txt ] || [ -s rolki.txt ] || exit 0
          while read p id; do node render.js $p --id $id; done < plan.txt
          while read p id; do node render.js $p --id $id && node rolka.js $p $id; done < rolki.txt
          cd output && git init -q -b obrazki && git add . && git commit -qm "obrazki" \
            && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" obrazki
          sleep 20
      - name: Publikacja
        run: |
          if [ -n "$ROLKA_TERAZ" ]; then node publikuj_rolke.js; exit $?; fi
          node publikuj.js $TRYB
          if [ -n "$TRYB" ]; then node publikuj_rolke.js --auto; fi
      - name: Zapis stanu
        if: always()
        run: |
          git add opublikowane
          git diff --cached --quiet || (git commit -m "Opublikowano" && git pull --rebase && git push)
